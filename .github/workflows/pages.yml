name: pages

# 把 docs/ 发成 GitHub Pages。存在理由：对标轮实测本仓 `homepage` 字段为 null，
# 是对比样本六仓里唯一没有文档落点的；而赛道官方描述明确「尤其关注工具易用性、
# **文档完善程度**与实际使用案例」。这条作业把「文档在场」升级成「文档可看」。
# 注：Pages 源需先设为 GitHub Actions（build_type=workflow）。没配成功时本作业会红，
# 那时对外一律按「未部署」表述，禁写"演示页在线"。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages (enable it if the repo has no Pages site yet)
        # 实测红因（run 36477680466）：默认 enablement=false 时，若 Pages 尚未启用，
        # configure-pages 直接 `Get Pages site failed ... Not Found` 判红——
        # 而「第一次 push 触发部署、Pages 还不存在」正是最常见的首次落地顺序。
        # 置 true 让动作自己建站，红因消失；这也是把「配置在场」变成「行为回执」的做法。
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
