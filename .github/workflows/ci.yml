name: ci

# 触发面刻意**不含 pull_request**：PR 走 ci-pr.yml 的快档（对标 mem0 把受理闸与合入闸
# 拆成 ci-gate.yml / pr-gate.yml 两条的做法）。拆的理由不是省算力，是归因——
# 本仓常有并发会话在写，让未受理的 PR 与 main 共用一条全档链，红了分不清是谁的。
# 全档（含覆盖率地板与基准）仍只在 push 与手动派发时跑。
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime deps
        run: python -m pip install -r requirements.txt
      - name: Install test deps
        run: python -m pip install -r requirements-dev.txt
      - name: Install MCP SDK (optional extra, exercised by eval/mcp_server.py)
        # 不装则 test_mcp_server.py 整组判 SKIP —— 而 SKIP 不等于「验过了」。
        # 这条步的存在，就是让「agent 可直接调用」这句话在共享面上拿到行为回执。
        run: python -m pip install "mcp>=2.2,<3"
      - name: Public-clean gate is drillable (self-test both directions)
        run: python scripts/public_clean_check.py --selftest
      - name: Public-clean gate on the tree
        run: python scripts/public_clean_check.py
      # compileall 对不存在的目录只印 "Can't list" 并返回 rc=0（本机实测），
      # 所以先显式断言目录在场，否则下一步是假绿。
      - name: Assert expected source dirs exist
        run: |
          for d in eval audit scripts; do
            test -d "$d" || { echo "MISSING $d"; exit 1; }
          done
      - name: Syntax check
        run: python -m compileall -q eval audit scripts
      - name: Routing hit-rate evaluation on bundled examples
        run: python eval/hitrate_cli.py --skills-dir examples/skills --queries examples/queries.json --top 3
      - name: Agent Skills standard layout is routable
        # 打通 <name>/SKILL.md 布局后，这条步保证它是**真能评估**而不是仓里摆着好看。
        run: python eval/hitrate_cli.py --skills-dir examples/agent-skills/skills --queries examples/agent-skills/queries.json --top 3
      - name: Doc-link integrity on shipped root docs
        # 此前该判据在场却不在 CI 里，结果 README 引用了不存在的 SECURITY.md
        # 达一个版本周期无人察觉（2026-09-29 对标轮实测）。
        run: python eval/check_doc_links.py
      - name: Claim-face judge is drillable (self-test, both directions per family)
        run: python eval/doc_claim_face.py --selftest
      - name: Claim face in prose matches recomputed truth
        # 接线当场就抓到两处真漂移：README.en.md 声明 6 端、docs/INSTALL.md 声明 8 端，
        # 而同一仓的 truth_constants.json 现值 7。判据不写常量，权威值现算。
        # 2026-09-29 第 79 轮补两族：测试模块（在仓/摘除两个现算合法值）、
        # 以及 --audit-receipts 的「裸计数缺复算留痕」advisory 面（只印不改 rc；
        # 首跑真面命中 18 行，按 R236 补注③ 先量误报率再谈升档，见 DEBT L-9）。
        # pytest 汇总那一族在这里仍是盲区（本步没有跑批日志）——由后面
        # 「README face parity」步喂上同一次跑批的原文才真正咬人。
        run: python eval/doc_claim_face.py --audit-receipts
      - name: Scale benchmark smoke
        # 12 与 100 两档；1000 档留给夜间全量跑，CI 只保证「跑得动且抽查有效」。
        run: python eval/bench_router.py --sizes 12,100 --queries 8
      - name: MCP stdio handshake probe (source-tree face)
        # 与 install-face 用的是同一个探针，只是服务从仓内起：两面各证一次，
        # 免得「装出来的能握手、仓里的不能」这种半瘫状态被单条步掩盖。
        run: python scripts/mcp_stdio_smoke.py --server "$(command -v python)" --server-arg eval/mcp_server.py
      - name: Umbrella CLI aggregates the shipped self-checks (doctor)
        # 这条步判的不是「各判据是否绿」（上一步已各自跑过），而是**聚合面本身**：
        # doctor 必须至少汇总 8 项、JSON 单文档可解析、聚合出的 rc 与逐项 rc 一致。
        # 只测拼装不测聚合，就会出现「单项都绿、doctor 报两行红」这种半瘫。
        run: |
          python eval/fenjue_cli.py doctor --json > doctor.json
          python - <<'PY'
          import json
          d = json.loads(open("doctor.json", encoding="utf-8").read())
          checks = d["checks"]
          assert len(checks) >= 8, f"doctor 只汇总了 {len(checks)} 项，载体疑似丢失"
          assert all(c["rc"] == 0 for c in checks), [c for c in checks if c["rc"]]
          assert not str(d["version"]).startswith(("UNVERIFIED", "DRIFT")), d["version"]
          print(f"doctor 聚合面 OK：{len(checks)} 项，版本单源={d['version']}")
          PY
      - name: Scoped lint ratchet (new/shipped entrypoints)
        # 名册与 ci-pr.yml 同一份文件清单；全仓 ruff 尚有告警未清，见 docs/DEBT_UNWIRED.md 的 L-1。
        run: |
          python -m pip install "ruff==0.16.5"
          python -m ruff check --output-format=concise \
            eval/__init__.py eval/hitrate_cli.py eval/bench_router.py eval/mcp_server.py \
            eval/doc_claim_face.py eval/check_doc_links.py eval/fenjue_cli.py scripts/mcp_stdio_smoke.py \
            eval/tests/test_hitrate_cli.py eval/tests/test_mcp_server.py eval/tests/test_bench_router.py \
            eval/tests/test_fenjue_cli.py
      - name: Workflow job roster matches .ci/workflow_jobs.json
        # 接线原因：这条判据早在仓里，但判的是私有面的 8 作业名册，一跑就红，于是长期没人接。
        # 名册改为随仓声明后它才第一次具备「在子集面上跑绿」的可能——判据要能绿一次才算活。
        run: python scripts/ci_workflow_spec_check.py
      - name: Test suite
        # 不额外加 -q：pyproject 的 addopts 已含 -q，再传一个就成了 -qq，
        # pytest 会把「N passed, M skipped」整行压掉——CI 日志于是没有任何用例数。
        # 汇总同时落盘给下一步对账。⚠️ `| tee` 会把 rc 换成 tee 的 rc，所以显式 pipefail：
        # 判据的 rc 死在管道里＝「读数在、结论没了」，本仓为这一形状登记过专门条目。
        run: |
          set -o pipefail
          mkdir -p ci-results
          python -m pytest 2>&1 | tee ci-results/pytest.log
      - name: README face parity (this run's summary vs what README claims)
        # 单独成步而不是并进 Test suite：那一步红时这里不跑，正好——没有绿面汇总可对时
        # 拿失败日志去对账只会造出第二条不相干的红。
        # 为什么必须由 CI 喂：eval/doc_claim_face.py 的 pytest 族在本机没有跑批日志 ⇒ 记盲区
        # （docs/DEBT_UNWIRED.md 的 L-7）。判据在场而没人喂输入 = 一把从不咬的牙。
        run: python eval/doc_claim_face.py --from-pytest-log ci-results/pytest.log
      - name: Coverage measurement (blocking, floor from the CI face)
        # 单独一趟而不是并进 Test suite：那一步红时这一步就不跑了，正好丢掉最需要的读数。
        # 地板不取开发机、不取私有源仓面：run 36472484278 实测 Linux 面 composite 32%
        # （同提交 Windows 面 34.07%，用例面 Linux 642 passed/58 skipped 对 Windows 652/48，
        # 差的那 10 条是平台专属跳过）。沿用 .coveragerc 的 43 是**源仓面**的量 ⇒ 必红。
        # 28 = 32 × 0.875，按本仓惯例留 3–7pp 缓冲；上调路径同 .coveragerc 注记。
        run: python -m pytest --cov=eval --cov-report=term --cov-fail-under=28

  # 装面独立成 job（不与 build 同环境）：build 在源码树上跑，`import eval` 命中的是仓内目录，
  # 那条路永远测不到「pip install 之后」的面。runner 之间环境隔离，才是干净的第二个面。
  install-face:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel from source
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist
      - name: Install wheel into a clean venv (deps must come from pyproject dynamic)
        run: |
          set -e
          python -m venv .venv-wheel
          "$GITHUB_WORKSPACE/.venv-wheel/bin/python" -m pip install --quiet dist/*.whl "mcp>=2.2,<3"
          "$GITHUB_WORKSPACE/.venv-wheel/bin/python" -c "import numpy, sklearn, flask; print('运行依赖由包元数据带入')"
          test -x "$GITHUB_WORKSPACE/.venv-wheel/bin/fenjue-hitrate" || { echo "入口点没装出来: fenjue-hitrate"; exit 1; }
          test -x "$GITHUB_WORKSPACE/.venv-wheel/bin/fenjue-bench" || { echo "入口点没装出来: fenjue-bench"; exit 1; }
          test -x "$GITHUB_WORKSPACE/.venv-wheel/bin/fenjue-mcp" || { echo "入口点没装出来: fenjue-mcp"; exit 1; }
      - name: Run the three installed commands from OUTSIDE the repo
        # cwd 换到临时目录：任何隐式依赖仓根路径的写法都会在这一步暴露，而不是在评委机器上暴露。
        run: |
          set -e
          BIN="$GITHUB_WORKSPACE/.venv-wheel/bin"
          SMOKE=$(mktemp -d)
          cd "$SMOKE"
          "$BIN/fenjue-hitrate" --skills-dir "$GITHUB_WORKSPACE/examples/skills" \
            --queries "$GITHUB_WORKSPACE/examples/queries.json" --top 3
          "$BIN/fenjue-bench" --sizes 12,100 --queries 8
          # 统一入口的装面：--version 必须报出版本且与 pyproject 单源一致；
          # route 必须能排序；mcp-config 的 JSON 必须可被 json.loads（配置生成物不可解析=白给）。
          "$BIN/fenjue" --version
          "$BIN/fenjue" route "把这个统计结果画成柱状图" --skills-dir "$GITHUB_WORKSPACE/examples/skills" --top 3
          "$BIN/fenjue" mcp-config --client claude > cfg.json
          "$BIN/python" -c "import json;d=json.load(open('cfg.json'));s=d['mcpServers']['fenjue'];assert s['command'] and isinstance(s['args'],list);print('mcp-config 可解析：',s['command'])"
          # MCP 握手走仓内 Popen 探针（scripts/mcp_stdio_smoke.py），不用 shell 管道：
          # `printf | fenjue-mcp` 在写完那一刻 EOF，Linux runner 上服务端还没答 tools/list
          # 就退出（run 36478129692 实测红在这），而同一条命令在 Windows 能拿到完整回包——
          # 同一段 shell 在两个面行为不同，当判据就是造一把忽红忽绿的尺子。
          "$BIN/python" "$GITHUB_WORKSPACE/scripts/mcp_stdio_smoke.py" --server "$BIN/fenjue-mcp"
          echo "装面回执齐全：三条命令均在仓外跑出读数"
