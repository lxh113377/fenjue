# 焚诀 pyproject — 打包与工具链统一配置
# 模式: [project] + [build-system] + 单包 `eval`（2026-09-29 轮166 起 `pip install .` 真能装）。
#   上一版这里写的是「本仓非 package、不声明 [project.scripts]」，因为当时实测 pip install . 失败。
#   本轮把失败面补齐而不是继续声明做不到：见 [build-system] 与 [tool.setuptools]。
# 单一真相源: 此处为 pytest/mypy/ruff/packaging 唯一配置（pytest.ini/mypy.ini 已并入后删除）。
# 保留独立: .coveragerc（子集面地板由 CI 的 --cov-fail-under 覆盖，理由写在该文件注记里）。
# 依赖只钉一处: [project.dependencies] 走 dynamic 读 requirements.txt，
#   绝不在本文件再抄一份版本号 —— 抄第二次就是下一个「两份真相互相矛盾」的产地。

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fenjue"
version = "1.2.0"
description = "记忆焚诀 — 多 Agent 统一记忆与技能路由治理系统（对外子集）"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "刘星辉" }]
keywords = ["ai-agent", "memory", "skill-routing", "hit-rate-evaluation", "governance"]
dynamic = ["dependencies"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

# 三条对外入口都要求 rc 由 main() 返回（setuptools 折成退出码）。
# 装出来的 wheel 只含 eval/ 顶层 .py 与 *.json（271 blob 实测 2.79 MB，无模型权重）；
# eval/tests 与 eval/verify_checks **不进包**：它们是仓内验证面，不是运行时产物。
[project.scripts]
fenjue-hitrate = "eval.hitrate_cli:main"
fenjue = "eval.fenjue_cli:main"
fenjue-bench = "eval.bench_router:main"
fenjue-mcp = "eval.mcp_server:main"

# 只有 MCP 面是可选依赖：装了才有 eval/mcp_server.py，没装则相关用例判 SKIP（不判 PASS）。
[project.optional-dependencies]
mcp = ["mcp>=2.2,<3"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools]
packages = ["eval"]
include-package-data = true

[tool.setuptools.package-data]
eval = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["eval/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q -p no:cacheprovider --timeout=120 --strict-markers"
# R208 A2: markers 注册区——当前仅用内置 parametrize，无需注册项。
# 后续新增自定义 marker（@pytest.mark.x）必须先在此登记，否则 --strict-markers 报错。
markers = [
    "integration: 需外部重资产/真实面的用例（冷态分钟级），默认不在快档与 pre-commit 链跑",
]

[tool.mypy]
# R208 O-7: 宽松增量——只查显式列出的文件（follow_imports=skip），不强制历史遗留全注解。
python_version = "3.13"
follow_imports = "skip"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false

[tool.ruff]
# R208 O-8: 基础配置。渐进收紧由后续轮次定（不阻塞提交）。
line-length = 120
target-version = "py313"
# 派生/归档/第三方目录不扫（与 .aiexclude 精神一致）
exclude = [
    ".git",
    ".github",
    ".cache",
    "_trash",
    "_temp",
    "_bak",
    "archive",
    "eval/bge_onnx",
    "publish/skill-hitrate-toolkit",
    "db_performance_optimization",
]

[tool.ruff.lint]
# ruff 官方默认基础规则集（最保守）:
#   F=pyflakes（未定义/未使用 import 等）E4/E7/E9=语法级错误。
# 不含 E501 行宽——历史代码大量长行，强制会海量噪音；E 系列其余规则同理留待后续收紧。
select = ["E4", "E7", "E9", "F"]
# E402 豁免（R210-05）：本仓为扁平脚本仓，sys.path.insert 后 import 顶层模块
# 是标准惯用法（见 conftest.py / workflow_gate.py），非真实错误。
ignore = ["E402"]
